<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2">
        <animate attributeName="stop-color" values="#fff1f2;#eff6ff;#fdf4ff;#fff1f2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#eff6ff">
        <animate attributeName="stop-color" values="#eff6ff;#fdf4ff;#fff7ed;#eff6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#fdf4ff">
        <animate attributeName="stop-color" values="#fdf4ff;#fff1f2;#ecfeff;#fdf4ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#60a5fa;#a78bfa;#fb7185;#f472b6" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a78bfa;#fb7185;#34d399;#60a5fa" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#fb7185;#34d399;#f472b6;#a78bfa" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" rx="20" fill="url(#bg)" stroke="#fce7f3" stroke-width="1.5"/>

  <circle cx="120" cy="50" r="28" fill="#fbcfe8" opacity="0.55">
    <animate attributeName="cy" values="40;70;40" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;32;24" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="140" r="36" fill="#bfdbfe" opacity="0.5">
    <animate attributeName="cy" values="150;110;150" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="30;40;30" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="45" r="18" fill="#ddd6fe" opacity="0.65">
    <animate attributeName="cx" values="620;660;620" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="150" r="14" fill="#fed7aa" opacity="0.7">
    <animate attributeName="cy" values="140;165;140" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="400" cy="100" r="70" fill="none" stroke="#fbcfe8" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="55;85;55" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="100" r="48" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="38;58;38" dur="4s" repeatCount="indefinite"/>
  </circle>

  <text x="400" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="4" fill="url(#title)" filter="url(#soft)">LinJJ12</text>

  <circle cx="560" cy="78" r="3" fill="#f472b6" opacity="0.9">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="92" r="2.5" fill="#60a5fa" opacity="0.9">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="118" r="2" fill="#a78bfa" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>

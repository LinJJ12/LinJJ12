<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d353;#ff7b72;#58a6ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d353;#ff7b72;#58a6ff;#bc8cff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#39d353">
        <animate attributeName="stop-color" values="#39d353;#ff7b72;#58a6ff;#bc8cff;#39d353" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="820" height="220" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <circle cx="60" cy="50" r="2.5" fill="#58a6ff" opacity="0.8">
    <animate attributeName="cy" values="40;180;40" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="170" r="2" fill="#bc8cff" opacity="0.7">
    <animate attributeName="cy" values="180;30;180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="1.8" fill="#39d353" opacity="0.6">
    <animate attributeName="cx" values="650;750;650" dur="9s" repeatCount="indefinite"/>
  </circle>

  <text x="410" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">LinJJ12</text>

  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#8b949e">ÆŽ'f · AI &amp; Full-Stack Developer</text>

  <rect x="210" y="155" width="400" height="3" rx="1.5" fill="url(#lineGrad)">
    <animate attributeName="x" values="160;260;160" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="410" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#58a6ff" opacity="0.95">
    <tspan>LLM</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#bc8cff">RAG</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#39d353">Agent</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#ff7b72">Python</tspan>
    <tspan fill="#484f58"> · </tspan>
    <tspan fill="#f0883e">Vue</tspan>
  </text>
</svg>
